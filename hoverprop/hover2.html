<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            background-color:blanchedalmond;
            height:100px;
            width:100px;
        }
        
        #box:hover{
            transform:rotate(360deg);
            transition:2s;
        }
         #box:hover{
            transform:translatex(100px);
            transition:2s;
        }
         #box:hover{
            transform:rotatex(180deg);
            transition:2s;
        }
         #box:hover{
            transform:scale(1.2);
            transition:2s;
        }
        

    </style>
</head>
<body>
    <div id="box">
HI
    </div>
</body>
</html>
